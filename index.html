			font-family: Arial, sans-serif;
			display: none; /* Oculto por defecto hasta que aplique la lógica */

		}
		#install-container p {

		}
		#btnInstallApp {
			background-color: #4CAF50;

			border: none;

			border-radius: 6px;
			cursor: pointer;
			width: 100%;

<body>
  
	<div id="tmpLoading" style="width: 100%; height: 100%; position: absolute; z-index: -2;background:#323232;"></div>

	<!-- Caja interactiva exclusivamente para Android (se oculta si ya está instalada o si se ve en PC) -->
	<div id="install-container">
		<p>Si estás desde un celular Android, haz clic en el botón de abajo para instalar la app:</p>
		<button id="btnInstallApp">Instalar App Android</button>
	</div>

		window.readerConfigLoaded = true;
	</script>
	
	<script src="javascript/pdf.js"></script>
	<script>
		try {
			if (pdfjsLib) {
				pdfjsLib.GlobalWorkerOptions.workerSrc = "javascript/pdf.worker.js";
			}
		} catch (error) {}
	</script>

	<!-- Script de PWA y lógica inteligente para Android adaptado a /bot-robot/ -->
	<script>
		// 1. Registrar Service Worker
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('/bot-robot/sw.js')
					.then(reg => console.log('Service Worker registrado:', reg.scope))
					.catch(err => console.log('Error en Service Worker:', err));
			});
		}

		let deferredPrompt;
		const installContainer = document.getElementById('install-container');
		const btnInstallApp = document.getElementById('btnInstallApp');

		// 2. Detectar si la app ya fue instalada previamente en modo standalone
		const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

		// 3. Capturar el evento de instalación de Android
		window.addEventListener('beforeinstallprompt', (e) => {
			e.preventDefault();
			deferredPrompt = e;
			
			// Mostrar la caja solo si NO está ya instalada y NO se está abriendo desde una PC
			if (!isStandalone && !/windows|macintosh|linux/i.test(navigator.userAgent)) {
				installContainer.style.display = 'block';
			}
		});

		// 4. Acción al hacer clic en el botón de Android
		btnInstallApp.addEventListener('click', async () => {
			if (deferredPrompt) {
				deferredPrompt.prompt();
				const { outcome } = await deferredPrompt.userChoice;
				if (outcome === 'accepted') {
					console.log('Usuario aceptó instalar la app');
				}
				deferredPrompt = null;
				installContainer.style.display = 'none';
			}
		});

		// 5. Ocultar en equipos de Escritorio (PC) por completo para que no estorbe
		window.addEventListener('DOMContentLoaded', () => {
			const isDesktop = /windows|macintosh|linux/i.test(navigator.userAgent);
			if (isDesktop || isStandalone) {
				installContainer.style.display = 'none';
			}
		});
	</script>
